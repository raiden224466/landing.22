
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Troy Bot | الدخول للبوت</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --accent-orange: #ff5500;
            --accent-hover: #ff7733;
            --text-main: #ffffff;
            --text-secondary: #a0a0a0;
            --border-color: #262626;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .bot-card {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
        }

        /* تنسيق لوغو TEXAS4WIN */
        .brand-logo-container {
            margin-bottom: 25px;
        }

        .brand-logo-text {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .brand-logo-text span {
            color: var(--accent-orange);
        }

        .bot-avatar {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
            background: var(--accent-orange);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(255, 85, 0, 0.4);
        }

        .bot-avatar svg {
            width: 40px;
            height: 40px;
            fill: #ffffff;
        }

        .bot-name {
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .bot-status {
            display: inline-block;
            font-size: 13px;
            color: #4cd137;
            background: rgba(76, 209, 55, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .bot-desc {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .btn-start {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            background-color: var(--accent-orange);
            color: #ffffff;
            text-decoration: none;
            font-size: 17px;
            font-weight: 700;
            padding: 15px 20px;
            border-radius: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(255, 85, 0, 0.4);
        }

        .btn-start:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 85, 0, 0.6);
        }

        .btn-start svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        .secure-note {
            margin-top: 20px;
            font-size: 12px;
            color: #777777;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="bot-card">
        <!-- لوغو TEXAS4WIN في الأعلى -->
        <div class="brand-logo-container">
            <div class="brand-logo-text">TEXAS<span>4</span>WIN</div>
        </div>

        <!-- شعار تيليجرام البرتقالي المبسط -->
        <div class="bot-avatar">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.03-1.99 1.27-5.62 3.72-.53.36-1.01.54-1.44.53-.47-.01-1.37-.26-2.03-.48-.82-.27-1.47-.42-1.42-.89.03-.25.38-.51 1.05-.78 4.11-1.79 6.85-2.97 8.22-3.54 3.91-1.63 4.72-1.91 5.25-1.92.12 0 .39.03.56.17.14.12.18.28.2.45-.02.07-.02.13-.04.2z"/>
            </svg>
        </div>

        <div class="bot-name">Troy Bot</div>
        <div class="bot-status">✓ البوت موثق</div>
        
        <p class="bot-desc">
            انقر على الزر أدناه للاشتراك في البوت
        </p>

        <!-- زر الدخول للبوت مع رابط الإحالة -->
        <a href="https://t.me/Troy_Texas_bot?start=8670718178" target="_blank" class="btn-start">
            <svg viewBox="0 0 24 24">
                <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
            </svg>
            الدخول للبوت
        </a>

        <div class="secure-note">
            منصة آمنة وموثوقة 100%<br>
            جميع الحقوق محفوظة © Troy Bot 2026
        </div>
    </div>

</body>
</html>
